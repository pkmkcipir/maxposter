name: Build Maxposter Windows Executables

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch: {}

jobs:
  build-client:
    runs-on: windows-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency client
        working-directory: client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Maxposter.exe (client)
        working-directory: client
        run: pyinstaller maxposter.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (MaxposterSetup.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\maxposter_setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artefak client (folder portabel)
        uses: actions/upload-artifact@v4
        with:
          name: Maxposter-Client-Portable
          path: client/dist/Maxposter/

      - name: Upload artefak installer
        uses: actions/upload-artifact@v4
        with:
          name: Maxposter-Setup-Installer
          path: installer/Output/*.exe

  build-server:
    runs-on: windows-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency server
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build MaxposterServer.exe
        working-directory: server
        run: pyinstaller maxposter_server.spec --noconfirm

      - name: Upload artefak server (folder portabel)
        uses: actions/upload-artifact@v4
        with:
          name: Maxposter-Server-Portable
          path: server/dist/MaxposterServer/

  release:
    needs: [ build-client, build-server ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download semua artefak
        uses: actions/download-artifact@v4

      - name: Kemas jadi ZIP
        run: |
          cd Maxposter-Client-Portable && zip -r ../Maxposter-Client-Portable.zip . && cd ..
          cd Maxposter-Server-Portable && zip -r ../Maxposter-Server-Portable.zip . && cd ..

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Maxposter-Client-Portable.zip
            Maxposter-Server-Portable.zip
            Maxposter-Setup-Installer/*.exe
          generate_release_notes: true
